<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700"
      rel="stylesheet"
      type="text/css"
    />
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8" />
  </head>

  <body>
    <div class="matrix-info__eisenhower">
      <img src="./eisenhower-matrix.jpg" />
      <a
        class="more-inf__link"
        href="https://goal-life.com/page/method/matrix-eisenhower"
        >Want more details?</a
      >
    </div>

    <div class="main-page__element">
      <div id="section__add-element">
        <label for="new-task">Add Item</label>
        <div class="task-row__wrapper">
          <input id="new-task-id" class="task__element" type="text" />
          <button>Add</button>
        </div>
      </div>

      <h3>Todo</h3>
      <ul id="incompleted-tasks">
        <li>
          <input type="checkbox" /><label class="task__element"
            >Pay Bills</label
          >
          <input type="text" class="task__element" />
          <button class="edit">Edit</button>
          <button class="delete"><img src="./remove.svg" /></button>
        </li>
        <li class="editMode">
          <input type="checkbox" /><label class="task__element"
            >Go Shopping</label
          >
          <input type="text" value="Go Shopping" class="task__element" />
          <button class="edit">Save</button>
          <button class="delete"><img src="./remove.svg" /></button>
        </li>
      </ul>

      <h3>Completed</h3>
      <ul id="completed-tasks">
        <li>
          <input type="checkbox" checked /><label class="task__element"
            >See the Doctor</label
          >
          <input type="text" class="task__element" />
          <button class="edit">Edit</button>
          <button class="delete"><img src="./remove.svg" /></button>
        </li>
      </ul>
    </div>
    <script src="app.js"></script>
  </body>
</html>
