<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Todo App</title>
    <link
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet"/>
    <link rel="stylesheet" href="style.css" media="screen" charset="utf-8" />
  </head>

  <body>
    <div class="matrix-info__eisenhower">
      <img class="header-image" src="./eisenhower-matrix.jpg" alt="Eisenhower Matrix"/>
      <a class="more-inf__link" href="https://goal-life.com/page/method/matrix-eisenhower"
        >Want more details?</a>
    </div>

    <main class="main-page__element">
      <section id="section__add-element">
        <label for="new-task">Add Item</label>
        <div class="task-row">
          <input id="new-task-id" class="task-input" type="text" />
          <button>Add</button>
        </div>
      </section>

      <h3>Todo</h3>
      <ul id="incompleted-tasks">
        <li>
          <input type="checkbox"/>
          <label class="task-input">Pay Bills</label>
          <input type="text" class="task-input" />
          <button class="edit">Edit</button>
          <button class="delete"><img src="./remove.svg" class="delete-image" alt="delete"/>
          </button>
        </li>
        <li class="edit-mode">
          <input type="checkbox"/><label class="task-input"
            >Go Shopping</label
          >
          <input type="text" value="Go Shopping" class="task-input" />
          <button class="edit">Save</button>
          <button class="delete"><img src="./remove.svg" class="delete-image" alt="delete"/></button>
        </li>
      </ul>

      <h3>Completed</h3>
      <ul id="completed-tasks">
        <li>
          <input type="checkbox" checked /><label class="task-input"
            >See the Doctor</label
          >
          <input type="text" class="task-input" />
          <button class="edit">Edit</button>
          <button class="delete"><img src="./remove.svg" class="delete-image" alt="delete"/></button>
        </li>
      </ul>
    </main>
    <script src="app.js"></script>
  </body>
</html>
